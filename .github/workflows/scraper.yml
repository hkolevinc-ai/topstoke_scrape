name: TopStokee Temu scraper

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Test scans 15 products; full scans the entire site"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - full
      max_products:
        description: "Optional limit; use 0 for the full site"
        required: true
        default: "0"
        type: string
      workers:
        description: "Parallel requests; 3 is safer for this site"
        required: true
        default: "3"
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run scraper
        run: >-
          python scraper.py
          --mode "${{ inputs.mode }}"
          --max-products "${{ inputs.max_products }}"
          --workers "${{ inputs.workers }}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topstokee-temu-results
          path: outputs/
          if-no-files-found: warn
          retention-days: 14
